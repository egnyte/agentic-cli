name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (trusted publishing + staged publishing support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Stage publish via OIDC
        run: npm stage publish --access public --@egnyte:registry=https://registry.npmjs.org/

      - name: Next step reminder
        run: echo "Package staged. Approve it at npmjs.com -> Staged Packages (requires 2FA/passkey)."
